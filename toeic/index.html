<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>성적상담지 · YOUFIT TOEIC</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--pp:#452062;--pp2:#5a2d7d;--ppd:#33163f;--pp3:#7b4aa0;--lav:#d0bfff;--lavs:#ede6f3;--bg:#f4f1f8;--tx:#2b2340;--mut:#8b849c;--ln:#d9d2e4;--ok:#1f8f4e;--er:#c0392b;--blue:#dbe9fb;--pink:#f6e2f0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{margin:0}
  body{font-family:'Pretendard',system-ui,'Malgun Gothic',sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 14px calc(80px + env(safe-area-inset-bottom))}
  /* 로그인 */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lc{width:100%;max-width:400px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px -12px rgba(53,22,63,.28);animation:rise .5s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .lc .h{background:linear-gradient(135deg,var(--pp),var(--ppd));padding:34px 28px 28px;text-align:center}.lc .h img{height:30px}.lc .h .t{color:#fff;font-weight:700;margin-top:16px;font-size:17px}.lc .h .s{color:var(--lav);font-size:13px;margin-top:5px}
  .lc .b{padding:26px}.lc input{width:100%;height:52px;padding:0 16px;font-size:16px;border:1.5px solid var(--ln);border-radius:13px;outline:none;background:#fbfafd;font-family:inherit;text-align:center;letter-spacing:1px}
  .lc input:focus{border-color:var(--pp2);box-shadow:0 0 0 4px rgba(90,45,125,.12)}
  .lc button{width:100%;height:52px;margin-top:12px;border:none;border-radius:13px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pp),var(--pp2))}
  .lc .hint{font-size:12.5px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.6}
  .lerr{color:var(--er);font-size:13px;margin-top:10px;font-weight:600;min-height:16px;text-align:center}
  #app{display:none}
  /* 성적상담지 - 종이 양식 재현 */
  .paper{position:relative;background:#fff;border-radius:16px;padding:26px 26px 30px;box-shadow:0 6px 24px rgba(53,22,63,.08)}
  .resetbtn{height:34px;padding:0 14px;border:1.5px solid var(--lav);background:#fff;color:var(--pp);border-radius:10px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
  .resetbtn:hover{background:#fdeff5}
  .banner{background:linear-gradient(135deg,var(--pp3),var(--pp));color:#fff;font-size:30px;font-weight:800;text-align:center;padding:16px;border-radius:40px;letter-spacing:-.01em;box-shadow:0 8px 20px -8px rgba(69,32,98,.5)}
  .infoline{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:15px;margin:30px 0 12px}
  .resetrow{text-align:right;margin-bottom:8px}
  .infoline b{border-bottom:1.5px solid var(--pp);padding:0 14px 2px;font-weight:800;min-width:70px;display:inline-block;text-align:center}
  .hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.form{border-collapse:collapse;width:100%;min-width:600px;font-size:12.5px;table-layout:fixed}
  table.form td,table.form th{border:1px solid var(--ln);padding:5px 6px;text-align:center;vertical-align:middle}
  .hd{background:var(--lavs);font-weight:800;color:var(--pp)}
  .hd2{background:#f5f0fa;font-weight:700}
  .lbl{background:#faf8fc;font-weight:700;white-space:nowrap}
  .pt{background:#fbfafd;font-size:11.5px;line-height:1.5;text-align:left;padding:8px}
  .fi{width:100%;height:30px;border:none;background:transparent;text-align:center;font-size:12.5px;font-family:inherit;outline:none}
  .fi:read-only{color:#5b5470}
  .fi.ed{background:transparent}
  .fi.ed:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--lav)}
  .fi[type="month"]{font-size:12px;padding:0 2px;color:var(--tx)}
  .ymcell{cursor:pointer} .ymcell input:not(:disabled){pointer-events:none}
  .books{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:18px 2px 12px;font-size:14px;font-weight:700;color:var(--pp)}
  .books input{flex:1;min-width:180px;height:38px;border:none;border-bottom:1.5px solid var(--pp);background:transparent;font-size:14px;font-family:inherit;outline:none;padding:0 6px}
  /* 메인 그리드 */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--ln)}
  table.grid{border-collapse:collapse;width:100%;min-width:720px;font-size:12px;table-layout:fixed}
  table.grid th,table.grid td{border:1px solid var(--ln);padding:3px 4px;text-align:center;vertical-align:middle}
  table.grid thead th{font-weight:800;font-size:11.5px;color:var(--pp)}
  .lch{background:var(--blue)}.p7h{background:var(--pink)}
  .lclab{background:#eef4fc;font-weight:800;white-space:nowrap;width:92px}
  .p7lab{background:#fbeef6;font-weight:800;white-space:nowrap;width:64px}
  .tot{background:#f3eff8;font-weight:800;color:var(--pp);width:52px}
  col.cw{width:70px}
  .cell{display:flex;flex-direction:column;gap:2px}
  .cell{position:relative;z-index:1}
  .cell input[type=number]{height:26px;padding:0 4px;font-size:12px;text-align:center;border:none;background:transparent;font-family:inherit;outline:none}
  .cell input[type=number]:focus{box-shadow:0 0 0 2px var(--lav);border-radius:4px}
  .cell input:focus{box-shadow:0 0 0 2px var(--lav);border-color:var(--pp2)}
  table.grid .cell input{text-align:center!important;width:100%;padding-left:0;padding-right:0}
  .dwrap{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:2px}
  .dwrap .sl{font-size:12px;color:var(--pp);font-weight:800;flex:none}
  table.grid .cell .dwrap input{width:26px!important;height:24px;font-size:12px;border:none;background:transparent;flex:none}
  table.grid .cell .dwrap input:focus{box-shadow:0 0 0 2px var(--lav);border-radius:4px}
  .cell input[type=number]{-webkit-appearance:none;-moz-appearance:textfield;appearance:none;margin:0}
  .cell input[type=number]::-webkit-outer-spin-button,.cell input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .inlsel{border:none;border-bottom:1.5px solid var(--pp);background:transparent;font-size:15px;font-weight:800;font-family:inherit;color:var(--tx);outline:none;padding:0 4px 2px;text-align:center;text-align-last:center;cursor:pointer;min-width:60px}
  .inlname{border:none;border-bottom:1.5px solid var(--pp);background:transparent;font-size:15px;font-weight:800;font-family:inherit;color:var(--tx);outline:none;padding:0 4px 2px;text-align:center;width:84px}
  .selsm{border:none;border-bottom:1px solid var(--pp3);background:transparent;font-family:inherit;font-size:12.5px;color:var(--pp);font-weight:700;outline:none;cursor:pointer;text-align:center;text-align-last:center}
  td.life{position:relative;cursor:pointer;user-select:none}
  td.life:hover{background:#fdf6fb}
  td.life.on{background:#fdeff5}
  td.life .chk{position:absolute;top:6px;right:8px;color:#e23b3b;font-size:18px;font-weight:900;display:none;pointer-events:none;line-height:1}
  td.life.on .chk{display:block}
  .fi:disabled{background:#efedf3!important;color:#c3bcd0;cursor:not-allowed}
  .totcell{display:flex;align-items:center;justify-content:center;gap:0;white-space:nowrap;overflow:hidden}
  .totcell .fi{width:30px!important}
  .paren{font-size:12px;color:var(--mut)}
  .stype{border:none;background:transparent;font-size:12px;font-family:inherit;color:var(--pp);font-weight:800;outline:none;cursor:pointer;padding:0;max-width:64px;text-align-last:center}
  .wkcell{display:flex;align-items:center;justify-content:center;gap:4px}
  .wkcell input{width:56px}
  .pl{display:inline-flex;gap:2px;margin-top:3px}
  .pl label{font-size:11.5px;font-weight:800;cursor:pointer;border:1.3px solid var(--ln);border-radius:5px;padding:1px 6px;color:var(--mut);background:#fff}
  .pl label.on{background:var(--pp);color:#fff;border-color:var(--pp)}
  td.hcell{position:relative}
  .hoverlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;font-size:82px;line-height:1;color:#f6a6c8;opacity:.32;pointer-events:none;z-index:0}
  td.hcell.on .hoverlay{display:block}
  td.hcell.on .cell{gap:1px;padding:6px 0}
  td.hcell.on .cell input{background:transparent!important;border-color:transparent!important;height:20px;font-size:11px;font-weight:700}
  .legend{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5}
  /* 하단 */
  .estimate{margin-top:18px;background:linear-gradient(135deg,var(--pp),var(--pp2));color:#fff;border-radius:16px;padding:18px 22px;display:flex;align-items:center}
  .estimate .el{font-size:13px;color:var(--lav);font-weight:600}.estimate .ev{font-size:30px;font-weight:800}.estimate .ev small{font-size:15px}
  .bar{position:sticky;bottom:0;margin-top:8px;display:flex;gap:12px;background:var(--bg);padding:14px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 16px -6px rgba(53,22,63,.12)}
  .btn{flex:1;height:54px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:800}
  .btn.draft{background:#fff;color:var(--pp);border:1.5px solid var(--lav)}
  .btn.submit{color:#fff;background:linear-gradient(135deg,var(--pp),var(--pp2));box-shadow:0 8px 20px -6px rgba(69,32,98,.5)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .note{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
  .estwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .estcard{background:linear-gradient(135deg,var(--pp),var(--pp2));color:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 8px 20px -8px rgba(69,32,98,.5)}
  .estcard.alt{background:var(--lavs);color:var(--pp);box-shadow:none;border:1px solid var(--ln)}
  .estcard .l{font-size:12.5px;font-weight:700;opacity:.85}.estcard.alt .l{color:var(--pp3);opacity:1}
  .estcard .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .estnote{margin-top:10px;font-size:13px;font-weight:600;line-height:1.6}
  .estnote .w{display:block;padding:8px 12px;border-radius:9px;margin-top:6px}
  .estnote .w.stop{background:#fdecea;color:var(--er)} .estnote .w.cond{background:#fbeede;color:var(--warn)} .estnote .w.good{background:#eafaf0;color:var(--ok)} .estnote .w.info{background:#eef2fb;color:#3a5a9a}
  .estbase{margin-top:8px;font-size:12px;color:var(--mut);text-align:center}
  @media(max-width:640px){.estwrap{grid-template-columns:1fr}}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1f8f4e;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:99;display:none;max-width:90%}
  .toast.err{background:var(--er)}.toast.show{display:block;animation:rise .3s}
  .pending{background:#fff;border-radius:20px;padding:44px 28px;text-align:center;box-shadow:0 8px 30px rgba(53,22,63,.1)}
  .pending .ic{font-size:44px}.pending .t{font-size:19px;font-weight:800;margin-top:14px}.pending .s{color:var(--mut);margin-top:8px;line-height:1.6;font-size:14px}
  /* 기본정보 카드 */
  .card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:20px 22px;margin-top:16px;box-shadow:0 2px 10px rgba(53,22,63,.04)}
  .card h3{margin:0 0 14px;font-size:14px;font-weight:800;color:var(--pp)}
  .titlebar{background:linear-gradient(135deg,var(--pp),var(--ppd));color:#fff;border-radius:20px;padding:22px 26px;display:flex;align-items:center;gap:16px}
  .titlebar img{height:26px}.titlebar .tt{font-size:19px;font-weight:800}.titlebar .q{font-size:12px;color:var(--lav);margin-top:3px}
  .row{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld label{font-size:12.5px;font-weight:600;color:#4a4359}
  .fld input,.fld select{height:46px;padding:0 13px;font-size:15px;font-family:inherit;color:var(--tx);background:#fbfafd;border:1.5px solid var(--ln);border-radius:11px;outline:none;-webkit-appearance:none;appearance:none}
  .fld input:read-only{background:#f3f1f7;border-style:dashed}
  .scrollhint{display:none}
  @media(max-width:640px){
    .wrap{padding:12px 8px calc(84px + env(safe-area-inset-bottom))}
    .paper{padding:16px 10px 22px;border-radius:14px}
    .banner{font-size:19px;padding:12px;border-radius:24px}
    .infoline{gap:8px 14px;font-size:13px;margin:18px 0 8px}
    .infoline b{min-width:44px;padding:0 8px 2px}
    .inlsel{min-width:46px;font-size:13px}
    .books{gap:6px 14px;font-size:13px;margin:14px 2px 10px}
    .books input{min-width:130px;flex:1 1 100%}
    .g2,.g3{grid-template-columns:1fr}
    .scrollhint{display:block;font-size:11.5px;color:var(--mut);margin:0 2px 6px;font-weight:600}
    .btn{height:50px;font-size:15px}
    .resetrow{margin-bottom:6px}
  }
</style></head><body>

function fld(l,id,v,ro,type){return '<div class="fld"><label>'+l+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(v)+'"'+(ro?' readonly':'')+'></div>';}
function sel(l,id,opts,v){var o=opts.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>';}).join('');return '<div class="fld"><label>'+l+'</label><select id="'+id+'"><option value="" disabled'+(v?'':' selected')+'>선택</option>'+o+'</select></div>';}
function saveBasic(){var info={className:$('className').value,manager:$('managerSel').value,curLC:$('curLC').value,curRC:$('curRC').value,curTot:$('curTot').value,tgtLC:$('tgtLC').value,tgtRC:$('tgtRC').value,tgtTot:$('tgtTot').value,studyMonths:$('studyMonths').value,weeklyHours:$('weeklyHours').value,workType:$('workType').value,partReason:$('partReason').value};
  if(!info.manager){toast('담당 매니저를 선택하세요.',true);return;}
  google.script.run.withSuccessHandler(function(res){if(!res.ok){toast(res.error,true);return;}
    $('appwrap').innerHTML='<div class="pending"><div class="ic">⏳</div><div class="t">승인 대기 중</div><div class="s">기본정보가 저장됐어요.<br>담당 매니저 <b>'+esc(info.manager)+'</b>님 승인 후<br>성적상담지 작성이 열립니다.</div></div>';
  }).withFailureHandler(function(e){toast('오류: '+e.message,true);}).saveBasicInfo(CODE,info);
}

/* 성적상담지 (승인 후) */
function loadSheet(){$('appwrap').innerHTML='<div class="pending"><div class="ic">⏳</div><div class="t">불러오는 중...</div></div>';
  google.script.run.withSuccessHandler(function(res){if(!res.ok){$('appwrap').innerHTML='<div class="pending"><div class="ic">🔒</div><div class="t">'+esc(res.error)+'</div></div>';return;}
    SHEET=res.sheet;renderSheet();
  }).withFailureHandler(function(e){toast('오류: '+e.message,true);}).getActiveSheet(CODE);
}

function ci(id,d){d=d||{};var parts=String(d.date||'').split('/');var mm=parts[0]||'',dd=parts[1]||'';
  return '<div class="cell"><div class="dwrap"><input type="number" inputmode="numeric" class="dmm" id="'+id+'-m" value="'+esc(mm)+'"><span class="sl">/</span><input type="number" inputmode="numeric" class="ddd" id="'+id+'-d" value="'+esc(dd)+'"></div><input type="number" min="0" id="'+id+'-w" value="'+esc(d.wrong!=null?d.wrong:'')+'"></div>';}
function ropen(id,v){return '<input class="fi ed" id="'+id+'" type="number" min="0" value="'+esc(v!=null?v:'')+'">';}

  var s=SESS.student, sh=SHEET, g=sh.grid, op=sh.opening||{};

  h+='<div class="banner">유핏토익 성적 상담지</div>';

  var cls=['A-1','A-2','A-3','A-4','B-1','B-2','B-3','B-4','B-5','B-6','D-1','D-2','D-3','D-4','F-1','F-2','F-3','F-4','F-5','F-6','F-7','G-1'];

  h+='<div class="infoline"><span>담당 : <select id="hdrMgr" class="inlsel">'+mopt+'</select> 매니저</span><span>첨삭 : <select id="hdrClass" class="inlsel">'+copt+'</select> 반</span><span>이름 : <input id="hdrName" class="inlname" value="'+esc(op.name||'')+'"></span><span>구분 : <select id="hdrCourse" class="inlsel">'+couopt+'</select></span></div>';
  h+='<div class="resetrow"><button class="resetbtn" onclick="resetForm()">↺ 초기화</button></div>';

function lcScore(w,lv){if(w==null)return null;if(w<=0)return lv>=2?440:400;var t=(lv>=2)?LC2:LC1;var s=t[w];if(s==null)s=(w>26?(lv>=2?380:300):null);return s;}

function estRange(base,d){/* 이번달 범위 */
  var C=$('hdrCourse')?$('hdrCourse').value:'up';
  var cur=num('op_curTot')!=null?num('op_curTot'):((num('op_curLC')||0)+(num('op_curRC')||0));
  if(C==='up'){ var top=base; if(cur&&base-cur>300)top=cur+300; var lo=top-50, boost=false;
    if(d&&d.lcTests>=4&&d.p7Tests>=3&&cur&&Math.floor(top/100)>Math.floor(cur/100)){var fl=Math.floor(top/100)*100; if(fl>lo){lo=fl;boost=true;}}
    return [lo,top,top!==base,boost]; }
  if(base>=800){var l8=800+Math.floor((base-800)/40)*40;return [l8,l8+40,false,false];}
  var lo2=Math.floor(base/50)*50;return [lo2,lo2+50,false,false];
}
function deriveCalc(){
  var lcw=null,lcl=1,rcw=null,rcl=1,zero=false,lcTests=0,p7Tests=0,hf=[],r55=[];
  for(var i=0;i<10;i++){
    var lc=0,any=false;['p1','p2','p3','p4'].forEach(function(p){var w=num('lc'+i+p+'-w');if(w!=null){lc+=w;any=true;}});
    if(any){lcTests++;lcw=lc;lcl=Number($('pl'+i)?$('pl'+i).value:1)||1;} // 마지막(최신) 채운 값으로 덮어씀
    var as=num('p7'+i+'afterS-w'),ad=num('p7'+i+'afterDT-w'),bs=num('p7'+i+'beforeS-w'),bd=num('p7'+i+'beforeDT-w');
    if(as!=null||ad!=null){p7Tests++;rcw=(bs||0)+(bd||0);rcl=Number($('plp7'+i)?$('plp7'+i).value:1)||1;zero=(as===0&&ad===0);
      hf.push(pass(bs,as)===true&&pass(bd,ad)===true);
      var bt=(bs||0)+(bd||0),at=(as||0)+(ad||0); r55.push(bt>0&&(bt-at)/bt>=0.55);}
  }
  return {lcw:lcw,lcl:lcl,rcw:rcw,rcl:rcl,zero:zero,lcTests:lcTests,p7Tests:p7Tests,improving:last3all(hf),reduce55:last3all(r55)};
}

function updateEstimate(){

  if(lcp==null||rcp==null){$('estThis').textContent='입력 대기';$('estNext').textContent='-';$('estNote').innerHTML='';return;}
  var base=lcp+rcp, W=[], stop=false, cond=false;

  if(total<3){ stop=true; W.push(['stop','팟7 테스트 3개 미만 → 산정 불가']); }

  else if(d.reduce55){ cond=true; W.push(['cond','최신 3연속 쌍하트는 아니지만, 최신 3개 요약후가 55%↑ 감소 → 조건부 산정 (3연속 쌍하트 달성 시 확정)']); }
  else { stop=true; W.push(['stop','최신 3연속 쌍하트·요약후 55% 감소 모두 미달 → 산정 불가']); }

    if(d.lcl>=3&&d.zero&&d.rcl>=2)W.push(['good','900 안내 조건 충족']);
  }
  $('estThis').textContent = stop?'산정 불가':((cond?'(조건부) ':'')+r[0]+'~'+r[1]+'점');
  // 다음달
  var nextTxt='-';
  if(!stop){
    if(r[1]>=900){nextTxt='"900점부터는 10~20점 싸움"';}
    else{
      var work=$('op_worktype')?$('op_worktype').value:'', hrs=num('op_weekly'), cur=num('op_curTot')!=null?num('op_curTot'):((num('op_curLC')||0)+(num('op_curRC')||0));

      else nextTxt=nLo+'~'+nHi+'점';

  }

}
