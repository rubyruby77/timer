<title>예상점수 계산기 · YOUFIT TOEIC</title>

<style>
  :root{--pp:#452062;--pp2:#5a2d7d;--ppd:#33163f;--pp3:#7b4aa0;--lav:#d0bfff;--lavs:#ede6f3;--bg:#f4f1f8;--tx:#2b2340;--mut:#8b849c;--ln:#d9d2e4;--ok:#1f8f4e;--er:#c0392b;--warn:#c8811a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{margin:0}
  body{font-family:'Pretendard',system-ui,'Malgun Gothic',sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:22px 14px calc(50px + env(safe-area-inset-bottom))}
  .titlebar{background:linear-gradient(135deg,var(--pp),var(--ppd));color:#fff;border-radius:20px;padding:22px 26px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 30px -10px rgba(53,22,63,.4)}
  .titlebar img{height:26px}.titlebar .tt{font-size:20px;font-weight:800}.titlebar .q{font-size:12px;color:var(--lav);margin-top:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:20px 22px;box-shadow:0 2px 10px rgba(53,22,63,.04)}
  .card h3{margin:0 0 14px;font-size:14px;font-weight:800;color:var(--pp)}
  .fld{margin-bottom:13px}
  label{font-size:13px;font-weight:600;color:#4a4359;display:block;margin-bottom:6px}
  .note-need{color:var(--warn);font-weight:800;font-size:11px;margin-left:5px}
  input,select{width:100%;height:46px;padding:0 13px;font-size:15px;font-family:inherit;color:var(--tx);background:#fbfafd;border:1.5px solid var(--ln);border-radius:11px;outline:none;-webkit-appearance:none;appearance:none}
  input:focus,select:focus{border-color:var(--pp2);box-shadow:0 0 0 4px rgba(90,45,125,.1)}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238b849c' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .out .big{background:linear-gradient(135deg,var(--pp),var(--pp2));color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .out .big .l{font-size:12px;color:var(--lav);font-weight:600}.out .big .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .out .big.alt{background:var(--lavs);color:var(--pp)}.out .big.alt .l{color:var(--pp3)}
  .base{background:#faf8fc;border:1px solid #f0eaf6;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:700}
  .base b{color:var(--pp);font-size:16px}
  .warns{list-style:none;padding:0;margin:6px 0 0}
  .warns li{font-size:13px;font-weight:600;padding:10px 13px;border-radius:10px;margin-bottom:8px;line-height:1.5}
  .warns li.stop{background:#fdecea;color:var(--er)}
  .warns li.cond{background:#fbeede;color:var(--warn)}
  .warns li.good{background:#eafaf0;color:var(--ok)}
  .warns li.info{background:#eef2fb;color:#3a5a9a}
  .foot{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.6}
  .foot b{color:var(--warn)}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style></head><body>

  <div class="grid2">
    <div class="card">
      <h3>📥 입력</h3>
      <div class="fld"><label>반 구분</label><select id="cls"><option value="up">업반</option><option value="pl">플반</option></select></div>
      <div class="fld"><label>현재 점수</label><input id="cur" type="number" placeholder="예: 550"></div>
      <div class="two">
        <div class="fld"><label>LC 오답수</label><input id="lcw" type="number" placeholder="개"></div>
        <div class="fld"><label>LC 레벨 <span class="note-need">※3확인</span></label><select id="lcl"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
      </div>
      <div class="two">
        <div class="fld"><label>팟7 오답수(요약후)</label><input id="rcw" type="number" placeholder="개"></div>
        <div class="fld"><label>팟7 레벨</label><select id="rcl"><option value="1">1</option><option value="2">2</option></select></div>
      </div>
      <div class="two">
        <div class="fld"><label>근무 형태</label><select id="work"><option value="full">풀타임</option><option value="part">파트타임</option></select></div>
        <div class="fld"><label>주 공부시간</label><input id="hrs" type="number" placeholder="시간"></div>
      </div>
      <div class="two">
        <div class="fld"><label>제출 테스트 수</label><input id="tt" type="number" placeholder="개"></div>
        <div class="fld"><label>팟7 테스트 수</label><input id="p7t" type="number" placeholder="개"></div>
      </div>
      <div class="two">
        <div class="fld"><label>쌍하트 달성 수</label><input id="hh" type="number" placeholder="개"></div>
        <div class="fld"><label>LC 추세</label><select id="trend"><option value="ok">안정적으로 감소</option><option value="bad">늘었다줄었다 반복</option></select></div>
      </div>
      <div class="fld"><label>요약후 00하트(전부 0)?</label><select id="zero"><option value="0">아니오</option><option value="1">예</option></select></div>
    </div>
    <div class="card out">
      <h3>📤 결과</h3>
      <div class="base">기본 계산 점수 : <b id="oBase">-</b> <span id="oParts" style="color:#8b849c;font-weight:600;font-size:12px"></span></div>
      <div class="big"><div class="l">이번 달 예상 점수</div><div class="v" id="oThis">-</div></div>
      <div class="big alt"><div class="l">다음 달 예상 점수</div><div class="v" id="oNext">-</div></div>

      <div class="foot">
        ※ <b>확인필요</b> 항목 (클라 미팅 후 수정 가능):<br>
        ① LC/RC 오답수 = 대표 테스트 직접입력 방식 &nbsp; ② 퀄리티·공부량은 경고만, 최종조정 매니저 &nbsp; ③ LC 레벨3 점수표는 임시값(레벨2 +50)<br>
        · 범위·조건은 계산 참고치이며, 최종 예상점수는 담당 매니저가 확정합니다.
      </div>
    </div>
  </div>
</div>
<script>
/* ===== 환산표 (엑셀 DB 해독 · 검증완료) ===== */
function rng(a,b,v,o){for(var n=a;n<=b;n++)o[n]=v;return o;}
var LC1={},LC2={};
rng(1,4,400,LC1);rng(5,9,380,LC1);rng(10,14,370,LC1);rng(15,19,350,LC1);rng(20,22,320,LC1);rng(23,26,300,LC1);
rng(1,4,440,LC2);rng(5,9,430,LC2);LC2[10]=420;LC2[11]=420;LC2[12]=400;LC2[13]=400;LC2[14]=400;rng(15,26,380,LC2);
var RC1={};RC1[8]=400;RC1[9]=400;RC1[10]=390;rng(11,13,370,RC1);rng(14,19,350,RC1);RC1[20]=320;rng(21,26,300,RC1);rng(27,29,290,RC1);RC1[30]=280;RC1[31]=270;rng(32,38,250,RC1);RC1[39]=230;rng(40,42,200,RC1);
function lcScore(w,lv){if(w<=0)return 440;var t=(lv>=2)?LC2:LC1;var s=t[w];if(s==null)s=(w<1?440:300);if(lv>=3&&s!=null)s+=50;/*임시*/return s;}
function rcScore(w){if(w<=7)return 400;var s=RC1[w];return s==null?200:s;}

var $=function(id){return document.getElementById(id);};
function n(id){var v=$(id).value;return v===''?null:Number(v);}
function calc(){
  var cls=$('cls').value, cur=n('cur'), lcw=n('lcw'), lcl=Number($('lcl').value), rcw=n('rcw');
  var work=$('work').value, hrs=n('hrs'), tt=n('tt'), p7t=n('p7t'), hh=n('hh'), trend=$('trend').value, zero=$('zero').value==='1', rcl=Number($('rcl').value);
  var W=[]; // 경고
  if(lcw==null||rcw==null){ $('oBase').textContent='-';$('oThis').textContent='입력 대기';$('oNext').textContent='-';$('oParts').textContent='';$('oWarn').innerHTML='';return; }
  var lcp=lcScore(lcw,lcl), rcp=rcScore(rcw), base=lcp+rcp;
  $('oBase').textContent=base+'점';
  $('oParts').textContent='(LC '+lcp+' + 팟7 '+rcp+')';

  // 산정 불가 판정
  var stop=false;
  if(tt!=null&&tt<3){W.push(['stop','전체 테스트 3개 미만 → 예상점수 산정 불가']);stop=true;}
  if(p7t!=null&&p7t<=2){W.push(['stop','팟7 테스트 2개 이하 → 예상점수 산정 불가']);stop=true;}
  if(p7t!=null&&hh!=null){ if(hh < Math.ceil(p7t/2)){W.push(['cond','팟7 쌍하트 과반 미달 → 원칙상 산정 불가 (아쉽게 1~3개 차이면 "쌍하트 달성 시" 조건부 안내)']);} }

  // 이번 달 범위
  var thisLo,thisHi,thisLabel;
  if(cls==='up'){ // 업반: [base-50, base], 현재+300 상한
    var top=base; if(cur!=null&&base-cur>300){top=cur+300; W.push(['info','상승폭 +300 상한 적용 (현재 '+cur+' → '+top+')']);}
    thisHi=top; thisLo=top-50;
    if(trend==='bad'||(p7t!=null&&hh!=null&&hh<Math.ceil(p7t/2))){ W.push(['cond','퀄리티 저조(LC 반복 / 하트 부족) → 최소 +100 보장 후 하향조정 (매니저 판단)']); }
  } else { // 플반: 계산 중심 범위
    if(base>=800){thisLo=800+Math.floor((base-800)/40)*40;thisHi=thisLo+40;}
    else{thisLo=Math.floor(base/50)*50;thisHi=thisLo+50;}
  }
  // 700점대 조건
  if(base>=700&&base<800){ if(!(lcl>=2 && (p7t!=null&&hh!=null?hh>=Math.ceil(p7t/2):true))){ W.push(['cond','700점대는 LC 레벨2 + 팟7 쌍하트 충족 필요 → 조건 미충족 시 "달성 시 700" 조건부 안내']); } }
  // 900 안내 조건
  if(lcl>=3 && zero && rcl>=2){ W.push(['good','900 안내 조건 충족 (LC레벨3 + 요약후 00하트 + 팟7레벨2)']); }
  else if(base>=850){ W.push(['info','900 안내하려면: LC레벨3 + 요약후 00하트 + 팟7레벨2 필요']); }

  $('oThis').textContent = stop ? '산정 불가' : (thisLo+'~'+thisHi+'점');

  // 다음 달
  if(stop){ $('oNext').textContent='-'; }
  else if(thisHi>=900){ $('oNext').textContent='"900점부터는 10~20점 싸움"'; }
  else {
    var enough = (work==='full') || (hrs!=null&&hrs>=50);
    var bump = enough?150:100;
    var nLo=thisLo+bump, nHi=thisHi+bump;
    if(nHi>=900){ // 900 근접 조정
      var msg;
      if(work==='full'){msg='8후반~900';}
      else if(cur!=null&&cur>=850){msg='900까지';}
      else if(hrs!=null&&hrs>=50){msg='850~8후반';}
      else if(hrs!=null&&hrs>=40){msg='850';}
      else {msg='850~900 (공부량 확인)';}
      $('oNext').textContent=msg+'  (단순계산 '+nLo+'~'+nHi+')';
    } else {
      $('oNext').textContent=nLo+'~'+nHi+'점  (+'+bump+')';
    }
  }
  var html='';W.forEach(function(w){html+='<li class="'+w[0]+'">'+w[1]+'</li>';});
  $('oWarn').innerHTML=html;
}
document.querySelectorAll('input,select').forEach(function(el){el.addEventListener('input',calc);el.addEventListener('change',calc);});
calc();
</script></body></html>
