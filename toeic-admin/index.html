<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>성적상담지 관리자 · YOUFIT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--pp:#452062;--pp2:#5a2d7d;--ppd:#33163f;--pp3:#7b4aa0;--lav:#d0bfff;--lavs:#ede6f3;--bg:#f4f1f8;--tx:#2b2340;--mut:#8b849c;--ln:#e0d9ea;--ok:#1f8f4e;--er:#c0392b;--warn:#c8811a;--blue:#dbe9fb;--pink:#f6e2f0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:'Pretendard',system-ui,'Malgun Gothic',sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lc{width:100%;max-width:380px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px -12px rgba(53,22,63,.28);animation:rise .5s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .lc .h{background:linear-gradient(135deg,var(--pp),var(--ppd));padding:30px;text-align:center}.lc .h img{height:28px}.lc .h .t{color:#fff;font-weight:700;margin-top:14px}
  .lc .b{padding:26px}.lc input{width:100%;height:48px;padding:0 14px;font-size:15px;border:1.5px solid var(--ln);border-radius:12px;outline:none;background:#fbfafd;font-family:inherit}
  .lc input:focus{border-color:var(--pp2);box-shadow:0 0 0 4px rgba(90,45,125,.12)}
  .lc button{width:100%;height:50px;margin-top:12px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pp),var(--pp2))}
  .lerr{color:var(--er);font-size:13px;margin-top:10px;font-weight:600;min-height:16px;text-align:center}
  #app{display:none}
  .topbar{background:#fff;border-bottom:1px solid var(--ln);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
  .topbar img{height:22px}.topbar .ttl{font-weight:800;color:var(--pp);font-size:15px}.topbar .sp{flex:1}
  .ctrl{height:38px;border:1.5px solid var(--ln);border-radius:10px;padding:0 12px;font-family:inherit;font-size:14px;outline:none;background:#fbfafd;color:var(--tx)}
  .ctrl:focus{border-color:var(--pp2)}
  .logout{cursor:pointer;color:var(--mut);font-size:13px;font-weight:600;background:none;border:none}
  .wrap{padding:18px 20px 60px}
  .stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .stat{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(53,22,63,.04)}
  .stat .v{font-size:20px;font-weight:800;color:var(--pp)}.stat .l{font-size:12px;color:var(--mut);font-weight:600}
  .tablecard{background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(53,22,63,.05)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:13px;font-variant-numeric:tabular-nums}
  thead th{position:sticky;top:0;background:var(--pp);color:#fff;font-weight:700;font-size:12px;padding:11px 8px;text-align:center;white-space:nowrap;z-index:2}
  thead th.lc{background:#3f6c9e}thead th.rc{background:#9a4d84}thead th.est{background:var(--pp3)}
  tbody td{padding:8px 8px;text-align:center;border-bottom:1px solid #f1ecf6;white-space:nowrap}
  tbody tr:nth-child(even){background:#faf8fc}
  tbody tr:hover{background:var(--lavs)}
  .nm{font-weight:800}
  .badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}
  .b-up{background:var(--blue);color:#3f6c9e}.b-pl{background:var(--pink);color:#9a4d84}.b-plpl{background:#eadcff;color:var(--pp)}
  .calc{font-weight:800;color:var(--pp)}
  .cellin{width:96px;height:32px;border:1.5px solid transparent;border-radius:8px;text-align:center;font-family:inherit;font-size:13px;font-weight:700;background:#f3eff8;color:var(--pp);outline:none}
  .cellin:hover{border-color:var(--lav)}.cellin:focus{border-color:var(--pp2);background:#fff;box-shadow:0 0 0 3px rgba(90,45,125,.12)}
  .notein{width:150px;height:32px;border:1.5px solid transparent;border-radius:8px;padding:0 8px;font-family:inherit;font-size:12.5px;background:#fbfafd;outline:none;text-align:left}
  .notein:hover{border-color:var(--lav)}.notein:focus{border-color:var(--pp2);background:#fff}
  .flag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:3px}
  .f-stop{background:#fdecea;color:var(--er)}.f-cond{background:#fbeede;color:var(--warn)}
  .auto{font-size:10px;color:var(--pp3);font-weight:700;display:block;margin-top:2px}
  .empty{text-align:center;color:var(--mut);padding:50px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f8f4e;color:#fff;padding:11px 18px;border-radius:11px;font-weight:700;font-size:13px;z-index:99;display:none}
  .toast.show{display:block;animation:rise .3s}
  @media(max-width:640px){.wrap{padding:12px 10px 50px}}
</style></head><body>

<script>

/* ===== 예상점수 엔진 (검증완료) ===== */
var LC1={},LC2={},RC1={};
(function(){function R(a,b,v,o){for(var n=a;n<=b;n++)o[n]=v;}
R(1,4,400,LC1);R(5,9,380,LC1);R(10,14,370,LC1);R(15,19,350,LC1);R(20,22,320,LC1);R(23,26,300,LC1);
R(1,4,440,LC2);R(5,9,430,LC2);LC2[10]=420;LC2[11]=420;LC2[12]=400;LC2[13]=400;LC2[14]=400;R(15,26,380,LC2);
RC1[8]=400;RC1[9]=400;RC1[10]=390;R(11,13,370,RC1);R(14,19,350,RC1);RC1[20]=320;R(21,26,300,RC1);R(27,29,290,RC1);RC1[30]=280;RC1[31]=270;R(32,38,250,RC1);RC1[39]=230;R(40,42,200,RC1);})();
function lcScore(w,lv){if(w==null)return null;if(w<=0)return lv>=2?440:400;var t=(lv>=2)?LC2:LC1;var s=t[w];if(s==null)s=(w>26?(lv>=2?380:300):null);if(lv>=3&&s!=null)s+=50;return s;}
function rcScore(w){if(w==null)return null;if(w<=7)return 400;var s=RC1[w];return s==null?(w>42?200:null):s;}
function numW(c){return c&&c.wrong!==''&&c.wrong!=null?Number(c.wrong):null;}
function pass(b,a){if(b==null||a==null)return null;return b>11?(b-a>=11):(a<=1);}
function estFromData(op,grid){
  var lc=grid.lc||[],p7=grid.p7||[];
  var bestLc=Infinity,bestLcLv=1,lcTests=0,p7Tests=0,hearts=0,p7best=Infinity;
  for(var i=0;i<lc.length;i++){var t=lc[i]||{},s=0,any=false;['p1','p2','p3','p4'].forEach(function(p){var w=numW(t[p]);if(w!=null){s+=w;any=true;}});if(any){lcTests++;if(s<bestLc){bestLc=s;bestLcLv=Number(t.pl)||1;}}}
  for(var j=0;j<p7.length;j++){var q=p7[j]||{};var as=numW(q.afterS),ad=numW(q.afterDT),bs=numW(q.beforeS),bd=numW(q.beforeDT);if(as!=null||ad!=null){p7Tests++;var tot=(as||0)+(ad||0);if(tot<p7best)p7best=tot;}if(pass(bs,as)===true&&pass(bd,ad)===true)hearts++;}
  var lcw=bestLc===Infinity?null:bestLc, rcw=p7best===Infinity?null:p7best;
  var lcp=lcScore(lcw,bestLcLv), rcp=rcScore(rcw);
  var res={lcw:lcw,lcl:bestLcLv,rcw:rcw,lcp:lcp,rcp:rcp,base:null,thisText:'-',nextText:'-',flags:[]};
  if(lcp==null||rcp==null){res.thisText='입력부족';return res;}
  var base=lcp+rcp;res.base=base;
  var course=op.course||'up', cur=(Number(op.curLC)||0)+(Number(op.curRC)||0);
  if(lcTests<3||p7Tests<=2){res.flags.push(['f-stop','산정불가']);res.thisText='산정불가';res.nextText='-';return res;}
  if(hearts<Math.ceil(p7Tests/2))res.flags.push(['f-cond','쌍하트미달']);
  var lo,hi;
  if(course==='up'){var top=base;if(cur&&base-cur>300)top=cur+300;hi=top;lo=top-50;}
  else if(base>=800){lo=800+Math.floor((base-800)/40)*40;hi=lo+40;}
  else{lo=Math.floor(base/50)*50;hi=lo+50;}
  if(base>=700&&base<800&&!(bestLcLv>=2&&hearts>=Math.ceil(p7Tests/2)))res.flags.push(['f-cond','700조건']);
  res.thisText=lo+'~'+hi;
  if(hi>=900){res.nextText='900↑(10~20점싸움)';}
  else{var work=op.worktype||'',hrs=Number(op.weekly)||0;var bump=(work==='full'||hrs>=50)?150:100;var nlo=lo+bump,nhi=hi+bump;
    if(nhi>=900){res.nextText=(work==='full')?'8후~900':(cur>=850?'900':(hrs>=50?'850~8후':(hrs>=40?'850':'850~900')));}
    else res.nextText=nlo+'~'+nhi;}
  return res;
}

  var h='<thead><tr><th>제출일</th><th>매니저</th><th>반</th><th>이름</th><th>구분</th>'
    +'<th class="lc">LC오답</th><th class="lc">LC점</th><th class="rc">팟7오답</th><th class="rc">팟7점</th>'
    +'<th>현재</th><th>계산</th><th class="est">이번달 예상</th><th class="est">다음달 예상</th><th>재수강</th><th>비고</th></tr></thead><tbody>';
  if(!list.length){$('tbl').innerHTML=h+'<tr><td class="empty" colspan="15">제출한 학생이 없습니다</td></tr></tbody>';return;}
  list.forEach(function(s){
    var e=estFromData(s.opening||{}, s.grid||{});
    var cur=(Number(s.opening.curLC)||0)+(Number(s.opening.curRC)||0);
    var cou=COU[s.course]||['-',''];
    var flags=e.flags.map(function(f){return '<span class="flag '+f[0]+'">'+f[1]+'</span>';}).join('');
    var thisV=s.over.thisEst||e.thisText, nextV=s.over.nextEst||e.nextText;
    var thisAuto=s.over.thisEst?'<span class="auto">자동 '+esc(e.thisText)+'</span>':'';
    var nextAuto=s.over.nextEst?'<span class="auto">자동 '+esc(e.nextText)+'</span>':'';
    h+='<tr>'
      +'<td>'+esc(s.submittedAt)+'</td><td>'+esc(s.manager)+'</td><td>'+esc(s.className||'-')+'</td>'
      +'<td class="nm">'+esc(s.name)+'</td><td><span class="badge '+cou[1]+'">'+cou[0]+'</span></td>'
      +'<td>'+(e.lcw==null?'-':e.lcw)+(e.lcl>=2?'<span class="auto">Lv'+e.lcl+'</span>':'')+'</td><td>'+(e.lcp==null?'-':e.lcp)+'</td>'
      +'<td>'+(e.rcw==null?'-':e.rcw)+'</td><td>'+(e.rcp==null?'-':e.rcp)+'</td>'
      +'<td>'+(cur||'-')+'</td><td class="calc">'+(e.base==null?'-':e.base)+flags+'</td>'
      +'<td><input class="cellin" data-id="'+esc(s.id)+'" data-k="thisEst" value="'+esc(thisV)+'">'+thisAuto+'</td>'
      +'<td><input class="cellin" data-id="'+esc(s.id)+'" data-k="nextEst" value="'+esc(nextV)+'">'+nextAuto+'</td>'
      +'<td>'+esc(s.recheck||'-')+'</td>'
      +'<td><input class="notein" data-id="'+esc(s.id)+'" data-k="note" placeholder="비고" value="'+esc(s.over.note||'')+'"></td>'
      +'</tr>';
  });
  $('tbl').innerHTML=h+'</tbody>';
  document.querySelectorAll('.cellin,.notein').forEach(function(el){el.addEventListener('change',function(){saveOver(el.getAttribute('data-id'));});});
}
function stat(v,l){return '<div class="stat"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';}
function saveOver(id){
  var t=document.querySelector('.cellin[data-id="'+CSS.escape(id)+'"][data-k="thisEst"]');
  var n=document.querySelector('.cellin[data-id="'+CSS.escape(id)+'"][data-k="nextEst"]');
  var no=document.querySelector('.notein[data-id="'+CSS.escape(id)+'"]');
  var o={thisEst:t?t.value:'',nextEst:n?n.value:'',note:no?no.value:''};
  google.script.run.withSuccessHandler(function(res){if(res.ok){toast('저장됨');var s=SUBS.filter(function(x){return x.id===id;})[0];if(s)s.over=o;}}).adminSaveOverride(PW,id,o);
}
</script><script>window.addEventListener('load',function(){$('pw').value='preview';login();});</script>
