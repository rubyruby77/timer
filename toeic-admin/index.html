<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>성적상담지 관리자 · YOUFIT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --pp:#452062;--pp2:#5a2d7d;--ppd:#2f1543;--pp3:#8257a8;--lav:#d9c8f0;--lavs:#f0eaf7;
    --bg:#f4f1f8;--card:#ffffff;--line:#ece5f3;--line2:#f4eff9;
    --tx:#221a33;--mut:#8b84a0;--ok:#1f8f4e;--er:#c0392b;--warn:#c07a1a;
    --lcbg:#eaf1fb;--lctx:#3d6aa0;--p7bg:#fbe9f3;--p7tx:#9a4d84;--estbg:#efe7f8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Pretendard',system-ui,'Malgun Gothic',sans-serif;color:var(--tx);
    background:radial-gradient(1200px 500px at 100% -10%,#efe8f8 0,var(--bg) 55%);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  /* 로그인 */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lc{width:100%;max-width:370px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px -18px rgba(47,21,67,.35);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .lc .h{background:linear-gradient(150deg,var(--pp),var(--ppd));padding:34px 30px;text-align:center}
  .lc .h img{height:26px;filter:brightness(0) invert(1);opacity:.96}
  .lc .h .t{color:#fff;font-weight:800;margin-top:16px;font-size:16px;letter-spacing:-.01em}
  .lc .h .s{color:var(--lav);font-size:12.5px;margin-top:5px}
  .lc .b{padding:28px}
  .lc input{width:100%;height:50px;padding:0 16px;font-size:15px;border:1.5px solid var(--line);border-radius:13px;outline:none;background:#faf8fc;font-family:inherit}
  .lc input:focus{border-color:var(--pp3);box-shadow:0 0 0 4px rgba(130,87,168,.14)}
  .lc button{width:100%;height:50px;margin-top:12px;border:none;border-radius:13px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pp),var(--pp2));transition:transform .1s}
  .lc button:active{transform:scale(.99)}
  .lerr{color:var(--er);font-size:13px;margin-top:10px;font-weight:600;min-height:16px;text-align:center}
  /* 앱 */
  #app{display:none;min-height:100dvh}
  .topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:0 24px;height:62px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{height:22px}.brand .b1{font-weight:800;font-size:15px;color:var(--pp);letter-spacing:-.01em}
  .brand .b2{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
  .brand .div{width:1px;height:26px;background:var(--line);margin:0 2px}
  .sp{flex:1}
  .field{position:relative}
  .field svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
  .ctrl{height:40px;border:1.5px solid var(--line);border-radius:11px;padding:0 13px;font-family:inherit;font-size:13.5px;
    outline:none;background:#faf8fc;color:var(--tx);font-weight:600}
  .ctrl:focus{border-color:var(--pp3);box-shadow:0 0 0 3px rgba(130,87,168,.12)}
  .search{padding-left:34px;width:180px}
  .logout{cursor:pointer;color:var(--mut);font-size:13px;font-weight:700;background:none;border:none;padding:8px 10px;border-radius:9px}
  .logout:hover{background:var(--lavs);color:var(--pp)}
  .colbtn{height:40px;border:1.5px solid var(--line);border-radius:11px;padding:0 14px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--pp);background:#faf8fc;cursor:pointer}
  .colbtn:hover{border-color:var(--pp3)}
  .colpanel{display:none;position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px -12px rgba(47,21,67,.32);padding:12px;width:210px;z-index:60;max-height:70vh;overflow:auto}
  .cp-t{font-size:11px;font-weight:800;color:var(--mut);padding:2px 6px 8px}
  .cp-btns{display:flex;gap:6px;padding:0 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .cp-btns button{flex:1;height:30px;border:1px solid var(--line);border-radius:8px;background:#faf8fc;font-family:inherit;font-size:12px;font-weight:700;color:var(--pp);cursor:pointer}
  .cp-btns button:hover{background:var(--lavs);border-color:var(--pp3)}
  .cp-i{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .cp-i:hover{background:var(--lavs)} .cp-i input{width:16px;height:16px;accent-color:var(--pp)}
  .wrap{max-width:1320px;margin:0 auto;padding:24px}
  /* 통계 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:15px;
    box-shadow:0 4px 16px -8px rgba(47,21,67,.15)}
  .stat .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .ic.a{background:linear-gradient(135deg,#efe7f8,#e2d3f4);color:var(--pp)}
  .ic.b{background:#eaf1fb;color:var(--lctx)}.ic.c{background:#fbe9f3;color:var(--p7tx)}.ic.d{background:#e9dcff;color:var(--pp)}
  .stat .v{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .stat .l{font-size:12px;color:var(--mut);font-weight:600;margin-top:5px}
  /* 테이블 카드 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 34px -16px rgba(47,21,67,.22)}
  .cardhead{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .cardhead .t{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .cardhead .cnt{font-size:12px;font-weight:700;color:var(--pp);background:var(--lavs);padding:3px 10px;border-radius:20px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1200px;font-size:13px}
  thead .grp th{font-size:11px;font-weight:800;letter-spacing:.02em;padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
  thead .grp .g-st{color:var(--mut)} thead .grp .g-lc{color:var(--lctx);background:var(--lcbg)}
  thead .grp .g-p7{color:var(--p7tx);background:var(--p7bg)} thead .grp .g-est{color:var(--pp);background:var(--estbg)} thead .grp .g-mg{color:var(--mut)}
  thead .col th{font-size:11.5px;font-weight:700;color:#6a6280;padding:8px 10px;text-align:center;white-space:nowrap;
    position:sticky;top:36px;background:#fbfafd;border-bottom:1px solid var(--line);border-right:1px dashed #e7dff2;z-index:2}
  thead .col th.lc{background:#f4f8fd}thead .col th.p7{background:#fdf5fa}thead .col th.est{background:#f7f2fb}
  thead .col th:last-child{border-right:none}
  tbody td{padding:12px 10px;text-align:center;border-bottom:1px dashed #eee6f5;border-right:1px dashed #e7dff2;white-space:nowrap;vertical-align:middle}
  tbody td:last-child{border-right:none}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#faf7fd}
  .whocell{text-align:left!important;padding-left:16px!important}
  .whocell .n{font-weight:800;font-size:13.5px}.whocell .m{font-size:11px;color:var(--mut);margin-top:1px}
  .date{color:var(--mut);font-size:12px}
  .badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
  .b-up{background:var(--lcbg);color:var(--lctx)}.b-pl{background:var(--p7bg);color:var(--p7tx)}.b-plpl{background:#e9dcff;color:var(--pp)}
  .num{font-weight:600}.dim{color:var(--mut)}
  .lvtag{font-size:10px;font-weight:800;color:var(--pp3);background:var(--lavs);border-radius:5px;padding:0 4px;margin-left:3px}
  .calc{color:var(--pp);font-weight:800;font-size:15px}
  .flags{display:flex;gap:4px;justify-content:center;margin-top:5px}
  .flag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px}
  .f-stop{background:#fdeceb;color:var(--er)}.f-cond{background:#fbf0dd;color:var(--warn)}
  .estin{width:104px;height:34px;border:1.5px solid transparent;border-radius:10px;text-align:center;font-family:inherit;font-size:14px;font-weight:800;
    background:transparent;color:var(--pp);outline:none;transition:.12s;cursor:text}
  .estin:hover{border-color:var(--line);background:#faf8fc}
  .estin:focus{border-color:var(--pp3);background:#fff;box-shadow:0 0 0 3px rgba(130,87,168,.14)}
  .estin.next{color:var(--pp2);font-weight:700}
  .autohint{font-size:10px;color:var(--pp3);font-weight:700;margin-top:3px}
  .rechk{font-size:12px;font-weight:700}
  .notein{width:158px;height:34px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-family:inherit;font-size:12.5px;
    background:#faf8fc;outline:none;text-align:left}
  .notein:focus{border-color:var(--pp3);background:#fff;box-shadow:0 0 0 3px rgba(130,87,168,.1)}
  .empty{text-align:center;color:var(--mut);padding:64px 20px}.empty .ic{font-size:40px;opacity:.4}.empty .t{margin-top:12px;font-weight:700}
  .foot{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.7}.foot b{color:var(--warn)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ppd);color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;display:none;box-shadow:0 10px 30px rgba(47,21,67,.4)}
  .toast.show{display:block;animation:rise .3s}
  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 12px}}
</style></head><body>

function estFromData(op,grid){

  var lcw=null,lcl=1,rcw=null,lcTests=0,p7Tests=0,hf=[];
  for(var i=0;i<lc.length;i++){var t=lc[i]||{},s=0,any=false;['p1','p2','p3','p4'].forEach(function(p){var w=numW(t[p]);if(w!=null){s+=w;any=true;}});if(any){lcTests++;lcw=s;lcl=Number(t.pl)||1;}}

    else res.nextText=nlo+'~'+nhi;}
  return res;
}

 {k:'cls',g:'st',th:'반',pl:'반'},
 {k:'course',g:'st',th:'구분',pl:'구분'},
 {k:'week',g:'st',th:'주공부',pl:'주 공부시간'},
 {k:'lcw',g:'lc',th:'오답',pl:'LC 오답'},
 {k:'lcp',g:'lc',th:'점수',pl:'LC 점수'},
 {k:'p7w',g:'p7',th:'오답',pl:'팟7 오답'},
 {k:'p7p',g:'p7',th:'점수',pl:'팟7 점수'},
 {k:'cur',g:'est',th:'현재',pl:'현재점수'},
 {k:'tgt',g:'est',th:'목표',pl:'목표점수'},
 {k:'calc',g:'est',th:'계산',pl:'계산'},
 {k:'this',g:'est',th:'이번 달',pl:'이번달 예상'},
 {k:'next',g:'est',th:'다음 달',pl:'다음달 예상'},
 {k:'rechk',g:'mg',th:'재수강',pl:'재수강'},
 {k:'note',g:'mg',th:'비고',pl:'비고'}
];
var VIS={};COLS.forEach(function(c){VIS[c.k]=true;});
function thcls(g){return g==='lc'?' class="lc"':g==='p7'?' class="p7"':g==='est'?' class="est"':'';}
function buildPicker(){
  var p=$('colPanel');if(!p)return;
  p.innerHTML='<div class="cp-t">표시할 항목</div>'
    +'<div class="cp-btns"><button onclick="selectAll(true)">전체선택</button><button onclick="selectAll(false)">전체해제</button></div>'
    +COLS.map(function(c){return '<label class="cp-i"><input type="checkbox" data-c="'+c.k+'" '+(VIS[c.k]?'checked':'')+(c.always?' disabled':'')+'><span>'+c.pl+'</span></label>';}).join('');
  p.querySelectorAll('input').forEach(function(el){el.addEventListener('change',function(){VIS[el.getAttribute('data-c')]=el.checked;render();});});
}
function selectAll(v){COLS.forEach(function(c){if(!c.always)VIS[c.k]=v;});buildPicker();render();$('colPanel').style.display='block';}
function togglePanel(){var p=$('colPanel');p.style.display=(p.style.display==='block')?'none':'block';}
document.addEventListener('click',function(e){var p=$('colPanel');if(p&&p.style.display==='block'&&!p.contains(e.target)&&e.target.id!=='colBtn')p.style.display='none';});

function render(){
  var mgr=$('fMgr').value, q=($('fSearch').value||'').trim();
  var list=SUBS.filter(function(s){return (!mgr||s.manager===mgr)&&(!q||(s.name||'').indexOf(q)>=0);});
  $('cnt').textContent=list.length+'건';
  $('stats').innerHTML=stat('a','📄',list.length,'전체 제출')+stat('b','🟦',list.filter(function(s){return s.course==='up';}).length,'업반')
    +stat('c','🟪',list.filter(function(s){return s.course==='pl';}).length,'플반')+stat('d','🟣',list.filter(function(s){return s.course==='plpl';}).length,'플플반');
  var vc=COLS.filter(function(c){return VIS[c.k];});
  // 그룹 헤더
  var gh='<tr class="grp">';
  GORDER.forEach(function(g){var cs=vc.filter(function(c){return c.g===g;}).length;if(cs>0){gh+='<th class="'+GROUPS[g][1]+'" colspan="'+cs+'">'+GROUPS[g][0]+'</th>';}});
  gh+='</tr>';
  var ch='<tr class="col">'+vc.map(function(c){return '<th'+thcls(c.g)+'>'+c.th+'</th>';}).join('')+'</tr>';
  var h='<thead>'+gh+ch+'</thead><tbody>';
  if(!list.length){$('tbl').innerHTML=h+'<tr><td colspan="'+vc.length+'"><div class="empty"><div class="ic">🗂️</div><div class="t">제출한 학생이 없습니다</div></div></td></tr></tbody>';return;}
  list.forEach(function(s){
    var e=estFromData(s.opening||{}, s.grid||{});
    var cur=(Number(s.opening.curLC)||0)+(Number(s.opening.curRC)||0);
    var tgt=(Number(s.opening.tgtLC)||0)+(Number(s.opening.tgtRC)||0);
    var wk=s.opening.weekly, cou=COU[s.course]||['-',''];
    var flags=e.flags.length?'<div class="flags">'+e.flags.map(function(f){return '<span class="flag '+f[0]+'">'+f[1]+'</span>';}).join('')+'</div>':'';
    var thisV=s.over.thisEst||e.thisText, nextV=s.over.nextEst||e.nextText;
    var dim='<span class=dim>-</span>';
    var M={
      date:'<td class="date">'+esc(s.submittedAt)+'</td>',
      name:'<td class="whocell"><div class="n">'+esc(s.name)+'</div><div class="m">'+esc(s.manager)+' 매니저</div></td>',
      cls:'<td class="num">'+esc(s.className||'-')+'</td>',
      course:'<td><span class="badge '+cou[1]+'">'+cou[0]+'</span></td>',
      week:'<td class="num">'+(wk?esc(wk)+'h':dim)+'</td>',
      lcw:'<td class="num">'+(e.lcw==null?dim:e.lcw)+(e.lcl>=2?'<span class="lvtag">Lv'+e.lcl+'</span>':'')+'</td>',
      lcp:'<td class="num">'+(e.lcp==null?dim:e.lcp)+'</td>',
      p7w:'<td class="num">'+(e.rcw==null?dim:e.rcw)+'</td>',
      p7p:'<td class="num">'+(e.rcp==null?dim:e.rcp)+'</td>',
      cur:'<td class="num">'+(cur||dim)+'</td>',
      tgt:'<td class="num">'+(tgt||dim)+'</td>',
      calc:'<td><span class="calc">'+(e.base==null?'-':e.base)+'</span>'+flags+'</td>',
      this:'<td><input class="estin" data-id="'+esc(s.id)+'" data-k="thisEst" value="'+esc(thisV)+'">'+(s.over.thisEst?'<div class="autohint">자동 '+esc(e.thisText)+'</div>':'')+'</td>',
      next:'<td><input class="estin next" data-id="'+esc(s.id)+'" data-k="nextEst" value="'+esc(nextV)+'">'+(s.over.nextEst?'<div class="autohint">자동 '+esc(e.nextText)+'</div>':'')+'</td>',
      rechk:'<td class="rechk">'+(s.recheck?esc(s.recheck):dim)+'</td>',
      note:'<td><input class="notein" data-id="'+esc(s.id)+'" data-k="note" placeholder="비고 입력" value="'+esc(s.over.note||'')+'"></td>'
    };
    h+='<tr>'+vc.map(function(c){return M[c.k];}).join('')+'</tr>';
  });
  $('tbl').innerHTML=h+'</tbody>';
  document.querySelectorAll('.estin,.notein').forEach(function(el){el.addEventListener('change',function(){saveOver(el.getAttribute('data-id'));});});
}
function stat(c,ic,v,l){return '<div class="stat"><div class="ic '+c+'">'+ic+'</div><div><div class="v">'+v+'</div><div class="l">'+l+'</div></div></div>';}
function saveOver(id){
  var q=function(k){return document.querySelector('[data-id="'+CSS.escape(id)+'"][data-k="'+k+'"]');};
  var o={thisEst:(q('thisEst')||{}).value||'',nextEst:(q('nextEst')||{}).value||'',note:(q('note')||{}).value||''};
  google.script.run.withSuccessHandler(function(res){if(res.ok){toast('저장되었습니다');var s=SUBS.filter(function(x){return x.id===id;})[0];if(s)s.over=o;}}).adminSaveOverride(PW,id,o);
}
</script><script>window.addEventListener('load',function(){$('pw').value='preview';login();});</script>
</body></html>
